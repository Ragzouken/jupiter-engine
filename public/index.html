<body>
  <template data-audio>
    <audio id="audio/music/amb" loop src="assets/ambience.mp3"></audio>
    <audio id="audio/clips/wow" src="assets/wow.m4a"></audio>
    <audio id="audio/clips/click" src="assets/click.mp3"></audio>
    <audio id="audio/clips/grab" src="assets/drop.mp3"></audio>
    <audio id="audio/clips/drop" src="assets/drop.mp3"></audio>
    <audio id="audio/clips/valid" src="assets/valid.mp3"></audio>
    <audio id="audio/clips/none" src="assets/none.mp3"></audio>
  </template>

  <template data-events>
    <script id="events/poo">
      console.log("ASS")
    </script>
  </template>

  <script>
    const LOAD_EVENT_DATA = (element) => new AsyncFunction("", element.textContent);

    const EVENTS = TEMPLATE_QUERY_MAP(
      "template[data-events]",
      "script",
      LOAD_EVENT_DATA,
    )
  </script>

  <script>
    const LOAD_AUDIO_DATA = (element) => new Howl({
      src: element.getAttribute("src"),
      volume: parseFloat(element.getAttribute("volume") ?? "1"),
      loop: element.hasAttribute("loop"),
    });

    const SOUNDS = TEMPLATE_QUERY_MAP(
      "template[data-audio]", 
      "audio",
      LOAD_AUDIO_DATA,
    );
  </script>

  <p data-macro-links>
    hello [ass|poo] you are [mother|fucker] [goodbye]
  </p>
  <p>
    hello [ass|poo] you are [mother|fucker] goodbye
  </p>
  <script>
    function LINK(text, path) {
      return html("a", { href: `#${path}` }, text);
    }

    const LINKS_MACRO = TEXT_MARK_MACRO(LINK);

    ALL("[data-macro-links]").forEach(LINKS_MACRO);
    // APPLY_QUERY_MACRO("[data-macro-links]", LINKS_MACRO)
  </script>
</body>
