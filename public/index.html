  <p>
    hello [ass|poo] you are [mother|fucker] goodbye
  </p>
  <script>
    function applyLinks(root) {
      const LINK_REGEX = /\[(?<text>[^\]\|]+)\|(?<path>[^\]]+)\]/gd;

      applyTreeTextRegexReplacer(root, LINK_REGEX, (groups) => {
        const link = document.createElement("a");
        link.textContent = groups.text;
        link.href = `#${groups.path}`;
        return link;
      });
    }

    APPLY_MACRO("[data-macro-links]", applyLinks)
    // APPLY_MACRO("p:nth-child(3)", applyLinks)
  </script>
